<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nutcracker — login</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e6e8ec; --dim:#9aa4b2; --accent:#4c8dff; --critical:#d03b3b;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f4f5f7; --panel:#ffffff; --panel2:#f0f1f4; --border:#d9dce2;
      --text:#1a1d24; --dim:#5b6472; --accent:#2f6fed;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .box{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:28px;width:100%;max-width:340px}
  h1{font-size:18px;margin:0 0 4px;font-weight:700}
  h1 span{color:var(--accent)}
  p.sub{color:var(--dim);font-size:12px;margin:0 0 20px}
  label{display:block;font-size:12px;color:var(--dim);margin:14px 0 6px}
  input{width:100%;font:inherit;background:var(--panel2);border:1px solid var(--border);
    color:var(--text);border-radius:6px;padding:9px 11px}
  button{width:100%;margin-top:20px;cursor:pointer;background:var(--accent);color:#fff;
    border:none;font-weight:600;font:inherit;border-radius:6px;padding:10px}
  button:disabled{opacity:.5;cursor:not-allowed}
  .err{color:var(--critical);font-size:12px;margin-top:14px;min-height:16px}
</style>
</head>
<body>
  <form class="box" id="login-form">
    <h1>nut<span>cracker</span></h1>
    <p class="sub">Ingresá para acceder al dashboard.</p>
    <label for="u">Usuario</label>
    <input id="u" name="username" autocomplete="username" autofocus required>
    <label for="p">Contraseña</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="btn">Ingresar</button>
    <div class="err" id="err"></div>
  </form>
<script>
  const form = document.getElementById('login-form');
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: {'content-type': 'application/json'},
        body: JSON.stringify({
          username: document.getElementById('u').value,
          password: document.getElementById('p').value,
        }),
      });
      if (r.ok) {
        // Respeta ?next=<ruta> si el middleware nos mandó acá desde una URL.
        const next = new URLSearchParams(location.search).get('next') || '/';
        location.href = next.startsWith('/') ? next : '/';
        return;
      }
      err.textContent = r.status === 401
        ? 'Usuario o contraseña incorrectos.'
        : 'Error al iniciar sesión (' + r.status + ').';
    } catch (_) {
      err.textContent = 'No se pudo conectar con el servidor.';
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
