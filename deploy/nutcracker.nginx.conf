# Config de nginx para exponer el dashboard de nutcracker con HTTPS usando un
# certificado YA EMITIDO (ver deploy/README.md) -- no hace nada de ACME, solo
# carga cert.pem/key.pem como archivos y reenvía a uvicorn (127.0.0.1:8766).
#
# Copiar a /etc/nginx/conf.d/nutcracker.conf (ese directorio se incluye desde
# el bloque http{} de /etc/nginx/nginx.conf por defecto en Ubuntu/Debian, así
# que este archivo NO necesita tocar nginx.conf).
#
# WebUSB (navigator.usb) exige "secure context": HTTPS -- por eso este proxy
# es obligatorio para el despliegue en VPS, no opcional.
#
# A diferencia de Caddy, nginx NO detecta el header Upgrade solo -- el bloque
# `map` de abajo y los `proxy_set_header Upgrade/Connection` de la location
# son necesarios a mano para que /ws/jobs, /ws/chat y /ws/relay (WebSocket)
# funcionen detrás del proxy; sin esto, nginx cierra el handshake WS.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # Puerto público elegido: 8765 (en vez del 443 estándar).
    listen 8765 ssl;
    listen [::]:8765 ssl;

    # Rutas de ejemplo -- reemplazar por donde vivan TUS cert.pem/key.pem
    # (Let's Encrypt, Key Vault, un cert propio, lo que sea). Convención
    # sugerida si no tenés una ya: /etc/nutcracker/tls/ (ver deploy/README.md).
    ssl_certificate     /etc/nutcracker/tls/cert.pem;
    ssl_certificate_key /etc/nutcracker/tls/key.pem;

    # Default de nginx (1m) es demasiado chico para POST /api/apks/upload --
    # un .apk real fácil supera eso. 500m cubre app bundles grandes; subilo
    # más si necesitás subir algo todavía más pesado.
    client_max_body_size 1000m;

    location / {
        # 127.0.0.1:8766: el dashboard real (uvicorn) -- NO 8765, ese número
        # ya lo usa nginx puertas afuera. Ver nutcracker-dashboard.service.
        proxy_pass http://127.0.0.1:8766;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Los WS de este dashboard duran lo que dura un job (minutos) o una
        # sesión de relay entera -- el default de nginx (60s) cortaría
        # conexiones idle a mitad de un análisis largo.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
